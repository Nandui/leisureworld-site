  <title>Opening hours editor | LeisureWorld Cork</title>

<body>
  <!-- Staff editor for data/visit-information.json. Saving commits to GitHub and Vercel republishes the site. -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
  <script>
    // Sign-in runs through this site's own /api/cms-auth, on whichever address
    // the editor is opened from (live domain or a Vercel preview).
    CMS.init({ config: { backend: { name: 'github', base_url: location.origin } } });
  </script>
</body>
